<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CubusAgent 工作台</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --muted: #888; --accent: #2b6cb0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.live::before { content: "●"; color: #2f855a; margin-right: 6px; }
  #status.offline::before { content: "●"; color: #c53030; margin-right: 6px; }
  main { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 45px); }
  aside { border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  aside button { width: 100%; text-align: left; margin-bottom: 6px; }
  section { display: flex; flex-direction: column; overflow: hidden; }
  #toolbar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  #task { flex: 1; }
  #meta { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #transcript { flex: 1; overflow: auto; padding: 12px 16px; }
  .row { margin: 0 0 10px; }
  .who { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .user .body { background: #2b6cb01a; border-left: 3px solid var(--accent); padding: 6px 10px; white-space: pre-wrap; }
  .assistant .body { white-space: pre-wrap; }
  .thinking .body { white-space: pre-wrap; color: var(--muted); font-style: italic; }
  .tool { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .tool.failed { border-color: #c5303066; }
  .tool .name { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .tool pre { margin: 4px 0 0; white-space: pre-wrap; font-size: 12px; color: var(--muted); }
  .marker { font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; }
  .settled { color: #b7791f; }
  .error { color: #c53030; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); background: transparent; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 6px; color: var(--muted); }
  .badge.warn { color: #b7791f; border-color: #b7791f66; }
  input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
</style>
</head>
<body>
<header>
  <h1>CubusAgent 工作台</h1>
  <span class="badge" id="recipe">—</span>
  <span id="status">未连接</span>
</header>
<main>
  <aside>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button id="new-session">新建会话</button>
      <button id="refresh">刷新列表</button>
    </div>
    <div id="sessions"></div>
  </aside>
  <section>
    <div id="toolbar">
      <input id="task" placeholder="给 agent 的任务，例如：仓库里的测试失败了，找到原因并修复" />
      <button id="run">运行</button>
    </div>
    <div id="meta">选一个会话，或新建一个</div>
    <div id="transcript"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
